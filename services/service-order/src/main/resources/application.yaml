spring:
  application:
    name: "order-service"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        service: order-service
      config:
        namespace: dev
  config:
    import:
      - classpath:application-feign.yaml
      - nacos:service-order.properties
      - nacos:data-order.properties
    name: service-order

server:
  port: 8000
